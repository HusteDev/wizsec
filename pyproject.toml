[build-system]
requires = [
    "setuptools>=61",
    "setuptools_scm[toml]>=6.0"
]
build-backend = "setuptools.build_meta"

[project]
name = "wizsec"
dynamic = ["version"]
description = "A custom SDK for the Wiz API"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["Wiz", "SDK", "API", "Security"]

authors = [
    { name = "James Husted", email = "james@husted.dev" }
]

dependencies = [
    "httpx",
    "pyrate-limiter>=4.0,<5.0",
    "python-dotenv",
    "PyYAML",
    "graphql-core"
]

classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules"
]

[project.scripts]
wizsec = "wizsec._cli:main"

[project.urls]
homepage = "https://github.com/HusteDev/wizsec"
repository = "https://github.com/HusteDev/wizsec"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio",
    "black",
    "mypy",
    "types-PyYAML"
]
docs = [
    "mkdocs-material",
    "mkdocstrings[python]",
]

[tool.setuptools.packages.find]
include = ["wizsec", "wizsec.*"]

[tool.setuptools.package-data]
wizsec = ["py.typed", "wiz.config.template"]

[tool.setuptools_scm]
version_file = "wizsec/version.py"
version_scheme = "post-release"
local_scheme = "no-local-version"

[tool.black]
target-version = ["py39", "py310", "py311", "py312", "py313"]
line-length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "strict"

[tool.anyio]
backends = ["asyncio"]
