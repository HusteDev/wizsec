[build-system]
requires = [
    "setuptools>=61",
    "setuptools_scm[toml]>=6.0"
]
build-backend = "setuptools.build_meta"

[project]
name = "wiz-sdk"
dynamic = ["version"]
description = "A custom SDK for the Wiz API"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
keywords = ["Wiz", "SDK", "API", "Security"]

authors = [
    { name = "James Husted", email = "james@husted.dev" }
]

dependencies = [
    "httpx",
    "pyrate-limiter",
    "python-dotenv",
    "PyYAML",
    "graphql-core"
]

classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules"
]

[project.urls]
homepage = "https://github.com/HusteDev/wiz-sdk"
repository = "https://github.com/HusteDev/wiz-sdk"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio",
    "black",
    "mypy"
]

[tool.setuptools_scm]
version_file = "wiz_sdk/version.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
